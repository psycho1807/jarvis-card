name: Release
on:
  push:
    branches: [main]
    paths: [jarvis-card.js]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish a release when the version changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "JARVIS_VERSION = '\K[^']+" jarvis-card.js)
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 0; fi
          gh release create "v$VERSION" jarvis-card.js --title "Jarvis Card $VERSION" --notes "Jarvis Card $VERSION – talk to Home Assistant Assist with the animated Jarvis ring from the WallDock app."
